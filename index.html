<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />

    <link rel="stylesheet" href="style.css" />

    <title>Guess My Number!</title>
  </head>

  <body>
    <div class="game-container">
      <!-- Header -->
      <header>
        <div class="top-bar">
          <button class="btn again">↻ &nbsp; Again!</button>

          <p class="between">🎯 &nbsp; Between 1 and 20</p>
        </div>

        <h1 id="title">Guess My Number!</h1>

        <p class="subtitle">I've picked a number between 1 and 20.</p>

        <div class="number">?</div>
      </header>

      <!-- Main Game -->
      <main>
        <!-- Left / Input Section -->
        <section class="left">
          <div class="input-card">
            <div class="card-title">
              🧠
              <div>
                <h2>Your Guess</h2>
                <p>Enter a number between 1 and 20</p>
              </div>
            </div>

            <input
              type="number"
              class="guess"
              id="guessNum"
              placeholder="Enter your guess..."
              min="1"
              max="20"
            />

            <button class="btn check">Check! &nbsp; →</button>
          </div>
        </section>

        <!-- Right / Game Information -->
        <section class="right">
          <!-- Game Message -->
          <div id="message-box" class="message-box">
            <span>💡</span>
            <p class="message">Start guessing...</p>
          </div>
          <div class="stats-card">
            <h2>📊 &nbsp; Game Stats</h2>

            <div class="stat-item">
              <span class="stat-icon">💯</span>

              <div>
                <p>Score</p>
                <strong class="label-score">
                  <span class="score">20</span>
                </strong>
              </div>
            </div>

            <div class="stat-item">
              <span class="stat-icon">🥇</span>

              <div>
                <p>Highscore</p>
                <strong class="label-highscore">
                  <span class="highscore">0</span>
                </strong>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
